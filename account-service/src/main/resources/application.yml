server:
  port: 8081 # Port différent pour éviter les conflits

spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://localhost:8888 # Se connecte au Config-Service
  datasource:
    url: jdbc:h2:mem:accountdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/